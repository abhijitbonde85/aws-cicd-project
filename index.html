
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps CI/CD Project</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
        }

        .container {
            padding: 100px 20px;
        }

        h1 {
            color: #38bdf8;
            font-size: 42px;
        }

        p {
            font-size: 20px;
            color: #cbd5e1;
        }

        .card {
            margin: 30px auto;
            padding: 30px;
            max-width: 600px;
            background: #1e293b;
            border-radius: 15px;
        }

        .status {
            color: #4ade80;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>My DevOps CI/CD Project</h1>

        <div class="card">
            <h2>Automated Deployment on AWS</h2>

            <p>
                This website is deployed using Docker,
                GitHub Actions, Amazon ECR, and EC2.
            </p>

            <p class="status">
                Application Status: Running
            </p>

            <p>
                Version: 3.0
            </p>
        </div>
    </div>
</body>
</html>
